            </div>
            <p className="font-body text-body-sm text-light-outline tabular-nums mt-0.5" data-design-text-token="body-sm">
              ₹{item.price} × {item.quantity} = <span className="font-semibold text-leaf-green">₹{item.price * item.quantity}</span>
            </p>
          </div>

          <div className="flex items-center gap-1.5 shrink-0">
            <div className="inline-flex items-center rounded border border-light-outline-variant bg-light-surface">
              <button
                type="button"
                onClick={() => onDecrement(item.id)}
                aria-label={`Decrease ${item.name}`}
                className="p-1 text-teak-brown hover:bg-light-surface-container"
              >
                <MinusIcon className="w-3.5 h-3.5" />
              </button>
              <span className="px-2 font-label text-label-sm text-teak-brown tabular-nums" data-design-text-token="label-sm">
                {item.quantity}
              </span>
              <button
                type="button"
                onClick={() => onIncrement(item.id)}
                aria-label={`Increase ${item.name}`}
                className="p-1 text-teak-brown hover:bg-light-surface-container"
              >
                <PlusIcon className="w-3.5 h-3.5" />
              </button>
            </div>

            <button
              type="button"
              onClick={() => onRemove(item.id)}
              aria-label={`Remove ${item.name}`}
              className="p-1 text-light-outline hover:text-light-error transition-colors"
            >
              <Trash2Icon className="w-4 h-4" />
            </button>
          </div>
        </div>
      );
    }

    function CartSidebar({ cart, onIncrement, onDecrement, onRemove, onClearCart }) {
      const [orderPlaced, setOrderPlaced] = useState(false);

      const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      const gst = Math.round(subtotal * 0.05);
      const total = subtotal + gst;
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);

      const handlePlaceOrder = () => {
        setOrderPlaced(true);
        onClearCart();
      };

      return (
        <aside className="bg-light-surface-container-lowest rounded-lg border-2 border-turmeric-gold/60 shadow-md p-5 sticky top-20">
          <div className="flex items-center justify-between pb-3 border-b border-light-outline-variant">
            <div className="flex items-center gap-2">
              <ShoppingBagIcon className="w-5 h-5 text-leaf-green" />
              <h2 className="font-headline text-headline-md text-teak-brown" data-design-text-token="headline-md">
                Your Order
              </h2>
            </div>
            <span className="px-2.5 py-0.5 rounded-full bg-turmeric-gold text-on-turmeric-gold font-label text-label-sm tabular-nums" data-design-text-token="label-sm">
              {totalItems} {totalItems === 1 ? "Item" : "Items"}
            </span>
          </div>

          {orderPlaced ? (
            <div className="py-6 text-center space-y-3">
              <div className="w-12 h-12 rounded-full bg-light-surface-container text-leaf-green mx-auto flex items-center justify-center">
                <CheckCircle2Icon className="w-7 h-7" />
              </div>
              <h3 className="font-headline text-title-lg text-leaf-green" data-design-text-token="title-lg">
                Order Sent to Kitchen!
              </h3>
              <p className="font-body text-body-md text-light-on-surface-variant" data-design-text-token="body-md">
                Your freshly prepared Kerala meal will be served shortly.
              </p>
              <button
                type="button"
                onClick={() => setOrderPlaced(false)}
                className="w-full py-2 rounded bg-leaf-green text-on-leaf-green font-label text-label-lg hover:bg-light-primary"
              >
                <span data-design-text-token="label-lg">Start New Order</span>
              </button>
            </div>
          ) : cart.length === 0 ? (
            <div className="py-10 text-center space-y-2">
              <p className="font-headline text-title-md text-teak-brown" data-design-text-token="title-md">
                Your banana leaf is empty
              </p>
              <p className="font-body text-body-sm text-light-outline" data-design-text-token="body-sm">
                Tap &ldquo;Add to Cart&rdquo; on any Kerala dish to build your meal.
              </p>
            </div>
          ) : (
            <div className="mt-2">
              <div className="max-h-72 overflow-y-auto pr-1">
                {cart.map((item) => (
                  <CartItem
                    key={item.id}
                    item={item}
                    onIncrement={onIncrement}
                    onDecrement={onDecrement}
                    onRemove={onRemove}
                  />
                ))}
              </div>

              <div className="mt-4 pt-3 border-t border-light-outline-variant space-y-2">
                <div className="flex justify-between font-body text-body-md text-light-on-surface-variant">
                  <span data-design-text-token="body-md">Subtotal</span>
                  <span className="tabular-nums" data-design-text-token="body-md">₹{subtotal}</span>
                </div>
                <div className="flex justify-between font-body text-body-sm text-light-outline">
                  <span data-design-text-token="body-sm">GST (5%)</span>
                  <span className="tabular-nums" data-design-text-token="body-sm">₹{gst}</span>
                </div>
                <div className="flex justify-between pt-2 border-t border-light-surface-variant font-headline text-title-lg text-teak-brown">
                  <span data-design-text-token="title-lg">Total</span>
                  <span className="text-leaf-green tabular-nums" data-design-text-token="title-lg">₹{total}</span>
                </div>
              </div>

              <button
                type="button"
                onClick={handlePlaceOrder}
                className="w-full mt-4 py-3 rounded bg-leaf-green text-on-leaf-green font-label text-label-lg hover:bg-light-primary transition-colors shadow-sm"
              >
                <span data-design-text-token="label-lg">Place Order • ₹{total}</span>
              </button>
            </div>
          )}
        </aside>
      );
    }

    function Footer() {
      return (
        <footer id="contact" className="bg-teak-brown text-on-teak-brown border-t-4 border-turmeric-gold mt-auto pb-20 lg:pb-0">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
              <div id="about" className="space-y-3">
                <div className="flex items-center gap-2.5">
                  <div className="w-9 h-9 rounded-full bg-turmeric-gold text-on-turmeric-gold flex items-center justify-center">
                    <KeralaPalmEmblem className="w-5 h-5" />
                  </div>
                  <div>
                    <h3 className="font-headline text-title-lg text-on-teak-brown" data-design-text-token="title-lg">
                      NADAN THATTUKADA
                    </h3>
                    <p className="font-label text-label-sm text-light-secondary-container" data-design-text-token="label-sm">
                      Authentic Taste of Kerala
                    </p>
                  </div>
                </div>
                <p className="font-body text-body-sm text-light-surface-container leading-relaxed" data-design-text-token="body-sm">
                  Celebrating Kerala&apos;s culinary heritage with fresh coconut oil, clay-pot curries, hand-tossed porottas, and warm hospitality.
                </p>
              </div>

              <div className="space-y-2.5">
                <h3 className="font-headline text-title-md text-light-secondary-container" data-design-text-token="title-md">
                  Visit &amp; Hours
                </h3>
                <p className="flex items-start gap-2 font-body text-body-sm text-light-surface-container">
                  <MapPinIcon className="w-4 h-4 mt-0.5 shrink-0 text-turmeric-gold" />
                  <span data-design-text-token="body-sm">Marine Drive Road, Ernakulam, Kochi, Kerala 682031</span>
                </p>
                <p className="flex items-center gap-2 font-body text-body-sm text-light-surface-container">
                  <ClockIcon className="w-4 h-4 shrink-0 text-turmeric-gold" />
                  <span data-design-text-token="body-sm">Daily: 7:00 AM – 11:00 PM</span>
                </p>
              </div>

              <div className="space-y-2.5">
                <h3 className="font-headline text-title-md text-light-secondary-container" data-design-text-token="title-md">
                  Reservations &amp; Takeaways
                </h3>
                <p className="flex items-center gap-2 font-body text-body-sm text-light-surface-container">
                  <PhoneIcon className="w-4 h-4 shrink-0 text-turmeric-gold" />
                  <span data-design-text-token="body-sm">+91 484 236 8899</span>
                </p>
                <p className="font-body text-body-sm text-light-surface-container" data-design-text-token="body-sm">
                  &copy; 2026 Nadan Thattukada. All rights reserved.
                </p>
              </div>
            </div>
          </div>
        </footer>
      );
    }

    // =========================================================================
    // Main App
    // =========================================================================
    function App() {
      const [activeCategory, setActiveCategory] = useState("All");
      const [searchQuery, setSearchQuery] = useState("");
      const [cart, setCart] = useState([
        { ...MENU_ITEMS[0], quantity: 1 },
        { ...MENU_ITEMS[4], quantity: 1 },
      ]);
      const [mobileCartOpen, setMobileCartOpen] = useState(false);

      const filteredItems = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        return MENU_ITEMS.filter((item) => {
          const matchesCategory =
            activeCategory === "All" ||
            item.category === activeCategory ||
            item.secondaryCategory === activeCategory;
          const matchesQuery =
            !q ||
            item.name.toLowerCase().includes(q) ||
            item.description.toLowerCase().includes(q) ||
            item.category.toLowerCase().includes(q);
          return matchesCategory && matchesQuery;
        });
      }, [activeCategory, searchQuery]);

      const handleAddToCart = (item) => {
        setCart((prev) => {
          const existing = prev.find((c) => c.id === item.id);
          if (existing) {
            return prev.map((c) => (c.id === item.id ? { ...c, quantity: c.quantity + 1 } : c));
          }
          return [...prev, { ...item, quantity: 1 }];
        });
      };

      const handleIncrement = (id) => {
        setCart((prev) => prev.map((c) => (c.id === id ? { ...c, quantity: c.quantity + 1 } : c)));
      };

      const handleDecrement = (id) => {
        setCart((prev) =>
          prev
            .map((c) => (c.id === id ? { ...c, quantity: c.quantity - 1 } : c))
            .filter((c) => c.quantity > 0)
        );
      };

      const handleRemove = (id) => {
        setCart((prev) => prev.filter((c) => c.id !== id));
      };

      const handleClearCart = () => setCart([]);

      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      const total = subtotal + Math.round(subtotal * 0.05);

      return (
        <div className="min-h-screen flex flex-col bg-light-surface text-light-on-surface">
          <RestaurantNavbar
            cartCount={totalItems}
            onOpenMobileCart={() => setMobileCartOpen(true)}
          />

          <HeroBanner />

          <MenuCategories
            activeCategory={activeCategory}
            onSelectCategory={setActiveCategory}
            searchQuery={searchQuery}
            setSearchQuery={setSearchQuery}
          />

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
              {/* Menu Grid */}
              <div className="lg:col-span-8">
                <div className="flex items-center justify-between mb-4">
                  <h2 className="font-headline text-headline-md text-teak-brown" data-design-text-token="headline-md">
                    {activeCategory === "All" ? "All Kerala Dishes" : activeCategory}
                  </h2>
                  <span className="font-label text-label-md text-light-outline tabular-nums" data-design-text-token="label-md">
                    {filteredItems.length} {filteredItems.length === 1 ? "Dish" : "Dishes"}
                  </span>
                </div>

                <FoodGrid
                  items={filteredItems}
                  cart={cart}
                  onAdd={handleAddToCart}
                  onIncrement={handleIncrement}
                  onDecrement={handleDecrement}
                  onResetCategory={() => {
                    setActiveCategory("All");
                    setSearchQuery("");
                  }}
                />
              </div>

              {/* Desktop Right Cart Sidebar */}
              <div className="hidden lg:block lg:col-span-4">
                <CartSidebar
                  cart={cart}
                  onIncrement={handleIncrement}
                  onDecrement={handleDecrement}
                  onRemove={handleRemove}
                  onClearCart={handleClearCart}
                />
              </div>
            </div>
          </main>

          <Footer />

          {/* Mobile Fixed Bottom Cart Bar */}
          {totalItems > 0 && (
            <div className="lg:hidden fixed bottom-0 inset-x-0 z-40 bg-leaf-green text-on-leaf-green border-t-2 border-turmeric-gold px-4 py-3 shadow-lg">
              <div className="flex items-center justify-between gap-4">
                <div>
                  <p className="font-label text-label-md text-light-secondary-container tabular-nums" data-design-text-token="label-md">
                    {totalItems} {totalItems === 1 ? "Item" : "Items"} in Order
                  </p>
                  <p className="font-headline text-title-lg text-on-leaf-green tabular-nums" data-design-text-token="title-lg">
                    ₹{total} <span className="font-body text-body-sm font-normal">(incl. GST)</span>
                  </p>
                </div>
                <button
                  type="button"
                  onClick={() => setMobileCartOpen(true)}
                  className="px-5 py-2.5 rounded bg-turmeric-gold text-on-turmeric-gold font-label text-label-lg shadow-sm"
                >
                  <span data-design-text-token="label-lg">View Order</span>
                </button>
              </div>
            </div>
          )}

          {/* Mobile Cart Sheet */}
          {mobileCartOpen && (
            <div className="lg:hidden fixed inset-0 z-50 bg-teak-brown/60 flex items-end justify-center">
              <div className="bg-light-surface w-full max-h-[85vh] overflow-y-auto rounded-t-xl p-4">
                <div className="flex justify-end mb-2">
                  <button
                    type="button"
                    onClick={() => setMobileCartOpen(false)}
                    aria-label="Close order summary"
                    className="p-2 rounded-full text-teak-brown hover:bg-light-surface-container"
                  >
                    <XIcon className="w-5 h-5" />
                  </button>
                </div>
                <CartSidebar
                  cart={cart}
                  onIncrement={handleIncrement}
                  onDecrement={handleDecrement}
                  onRemove={handleRemove}
                  onClearCart={handleClearCart}
                />
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>


</body></html>
